type Query {
  product(sku: String!): Product
  sale(id: ID!): Sale
  inventoryOverview: InventoryOverview
  salesOverview: SalesOverview
  purchasesOverview: PurchasesOverview
}

type Mutation {
  createSale(input: CreateSaleInput!): CreateSaleResult!
}

type Product {
  sku: String!
  name: String!
  stock: Int!
  threshold: Int!
}

type InventoryOverview {
  criticalCount: Int!
  attention: [Product!]!
}

type SalesOverview {
  unitsToday: Float!
  recent: [RecentSale!]!
}

type RecentSale {
  sku: String!
  quantity: Int!
  createdAt: String!
}

type PurchasesOverview {
  pendingCount: Int!
  openOrderCount: Int!
  needs: [DashboardNeed!]!
}

type DashboardNeed {
  eventId: ID!
  sku: String!
  occurredAt: String!
  status: DashboardNeedStatus!
}

enum DashboardNeedStatus {
  PENDING
  DRAFT
  APPROVED
}

enum SaleStatus {
  PENDING
  CONFIRMED
  REJECTED
}

enum RejectionReason {
  PRODUCT_NOT_FOUND
  INSUFFICIENT_STOCK
}

type Sale {
  saleId: ID!
  sku: String!
  quantity: Int!
  status: SaleStatus!
  rejectionReason: RejectionReason
}

input CreateSaleInput {
  saleId: ID!
  sku: String!
  quantity: Int!
}

enum CreateSaleOutcome {
  ACCEPTED
  INVALID_ARGUMENT
  SALE_ID_CONFLICT
  UNKNOWN
}

type CreateSaleResult {
  outcome: CreateSaleOutcome!
  sale: Sale
}
