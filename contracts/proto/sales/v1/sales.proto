syntax = "proto3";

package smartstock.sales.v1;

option go_package = "smartstock/contracts/gen/go/sales/v1;salesv1";
option java_multiple_files = true;
option java_package = "com.smartstock.contracts.sales.v1";

service SalesService {
  rpc CreateSale(CreateSaleRequest) returns (CreateSaleResponse);
  rpc GetSale(GetSaleRequest) returns (GetSaleResponse);
  rpc GetSalesOverview(GetSalesOverviewRequest) returns (GetSalesOverviewResponse);
}

message GetSalesOverviewRequest {}

message RecentSale {
  string sale_id = 1;
  string sku = 2;
  int32 quantity = 3;
  string created_at = 4;
}

message GetSalesOverviewResponse {
  int64 units_today = 1;
  repeated RecentSale recent = 2;
}

enum SaleStatus {
  SALE_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  REJECTED = 3;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  PRODUCT_NOT_FOUND = 1;
  INSUFFICIENT_STOCK = 2;
}

message Sale {
  string sale_id = 1;
  string sku = 2;
  int32 quantity = 3;
  SaleStatus status = 4;
  // Set only for REJECTED.
  RejectionReason rejection_reason = 5;
}

message CreateSaleRequest {
  string sale_id = 1;
  string sku = 2;
  int32 quantity = 3;
}

message CreateSaleResponse {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    ACCEPTED = 1;
    INVALID_ARGUMENT = 2;
    SALE_ID_CONFLICT = 3;
  }

  Result result = 1;
  // Present only for ACCEPTED, including idempotent retries.
  Sale sale = 2;
}

message GetSaleRequest {
  string sale_id = 1;
}

message GetSaleResponse {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    FOUND = 1;
    NOT_FOUND = 2;
    INVALID_SALE_ID = 3;
  }

  Result result = 1;
  // Present only for FOUND.
  Sale sale = 2;
}
