resolver 127.0.0.11 valid=5s;

upstream smartstock_gateway {
    zone smartstock_gateway 64k;
    server gateway:3000 resolve;
}

upstream smartstock_front {
    zone smartstock_front 64k;
    server front:80 resolve;
}

server {
    listen 80;
    server_name localhost;

    location = /graphql {
        proxy_pass http://smartstock_gateway/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://smartstock_front;
        proxy_set_header Host $host;
    }
}
